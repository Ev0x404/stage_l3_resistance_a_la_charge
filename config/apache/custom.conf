### Documentation ###

## Pour le module
# <IfModule mpm_prefork_module>     =>  Configuration de MPM Prefork pour la gestion des requêtes
# StartServers                      =>  Nombre de processus enfants créés au démarrage du serveur. Chaque processus peut gérer une requête à la fois.
# MinSpareServers                   =>  Définition du nombre minimal de processus en attente de requêtes. Si le nombre passe au-dessous de cette valeur, le serveur Apache en créé de nouveaux.
# MaxSpareServers                   =>  Définition du nombre maximal de processus en attente de requêtes. Si le nombre passe au-dessous de cette valeur, le serveur Apache tue les processus supplémentaires.
# MaxRequestWorkers                 =>  Définition du nombre maximal de connexions simultanées. Les nouvelles requêtes sont mises en attente.
# MaxConnectionsPerChild            =>  Correspond au nombre maximal qu'un processus enfant peut traiter avant d'être remplacé. 0 : signifie que les processus ne sont jamais remplacés sauf en cas d'erreur.

## Pour le timeout
# Timeout                           =>  Temps maximum qu'attends le serveur pour une opération. S'il ne se passe rien, la connexion est fermée.


# Configuration pour le serveur apache (par défaut, apache écoute sur le port 80)
# ServerName localhost

# <IfModule mpm_prefork_module>
#     StartServers 5
#     MinSpareServers 5
#     MaxSpareServers 20
#     MaxRequestWorkers 20
#     MaxConnectionsPerChild 0
# </IfModule>

# Timeout 30


# Configuration limitante
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 5
    MaxConnectionsPerChild 0
</IfModule>

Timeout 5

# Limiter les clients lents
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=2-5,MinRate=100
    RequestReadTimeout body=5,MinRate=100
</IfModule>

# Désactiver KeepAlive pour forcer les clients à établir une nouvelle connexion à chaque requête
KeepAlive Off
